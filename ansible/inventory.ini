# =============================================================
# Inventaire Ansible - serveur web MediTrack
# Apres "terraform apply", remplacer IP_PUBLIQUE_EC2 par la valeur
# de la sortie Terraform "ec2_public_ip".
# =============================================================
[web]
meditrack-web-01 ansible_host=IP_PUBLIQUE_EC2

[web:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/meditrack
ansible_python_interpreter=/usr/bin/python3
