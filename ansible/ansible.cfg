# =============================================================
# ansible.cfg - Configuration Ansible du projet MediTrack
# =============================================================
[defaults]
# Inventaire genere automatiquement par Terraform
inventory = inventory.ini
retry_files_enabled = False
interpreter_python = auto_silent
# Affichage lisible des resultats (utile pour le rapport d'execution)
callback_result_format = yaml

[ssh_connection]
# accept-new : la cle du serveur est enregistree a la 1re connexion,
# puis toute modification ulterieure est refusee (protection MITM)
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
